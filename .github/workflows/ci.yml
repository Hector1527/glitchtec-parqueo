name: Validación
on: [push, pull_request]
jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vehicles, tickets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
        working-directory: services/${{ matrix.service }}
      - run: python -m pytest tests -q
        working-directory: services/${{ matrix.service }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.13.5'}
      - run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
        working-directory: infra
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: python scripts/smoke.py http://localhost:8080
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
