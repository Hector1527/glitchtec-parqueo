apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicles
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: vehicles}
  template:
    metadata:
      labels: {app: vehicles}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vehicles
          image: us-central1-docker.pkg.dev/REPLACE_PROJECT/glitchtec/vehicles:v1
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: parking-config}
            - secretRef: {name: parking-secret}
          resources:
            requests: {cpu: 25m, memory: 80Mi}
            limits: {cpu: 300m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vehicles
spec:
  selector: {app: vehicles}
  ports: [{port: 8000, targetPort: 8000}]
