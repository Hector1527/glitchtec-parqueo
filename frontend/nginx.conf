server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    # Variables fuerzan resolución DNS en tiempo de petición y evitan IPs obsoletas.
    # /etc/resolv.conf apunta a DNS de Docker o de Kubernetes; generado en arranque.
    # 15-resolver.sh define $vehicles_host/$tickets_host (FQDN del Service en Kubernetes).
    include /tmp/resolver.conf;
    location /api/vehicles/ {
        set $vehicles $vehicles_host:8000;
        rewrite ^/api/vehicles/(.*)$ /$1 break;
        proxy_pass http://$vehicles;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/tickets/ {
        set $tickets $tickets_host:8000;
        rewrite ^/api/tickets/(.*)$ /$1 break;
        proxy_pass http://$tickets;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
