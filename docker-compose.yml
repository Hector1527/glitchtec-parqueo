name: glitchtec-parqueo
x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-parking}
  POSTGRES_USER: ${POSTGRES_USER:-parking}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
  DB_HOST: postgres
  APP_VERSION: ${APP_VERSION:-local}
services:
  postgres:
    build: ./database
    environment: *db-env
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40", "-c", "work_mem=1MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT count(*) FROM members' | grep -q 6"]
      interval: 5s
      timeout: 4s
      retries: 24
    mem_limit: 256m
    restart: unless-stopped
  vehicles:
    build: ./services/vehicles
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    restart: unless-stopped
  tickets:
    build: ./services/tickets
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      vehicles:
        condition: service_healthy
      tickets:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
volumes:
  postgres-data:
